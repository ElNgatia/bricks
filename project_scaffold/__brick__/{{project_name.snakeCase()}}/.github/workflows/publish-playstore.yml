{{=<% %>=}}
name: Publish to Play Store

on:
  release:
    types: [published]

permissions:
  actions: read
  checks: read
  deployments: read
  pull-requests: write
  repository-projects: read
  statuses: write
  contents: write

concurrency:
  group: playstore-publish-workflow
  cancel-in-progress: true

jobs:
  set-app-version:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}
    outputs:
      BUILD_NUMBER: ${{ steps.set_app_version.outputs.BUILD_NUMBER }}
      APP_VERSION: ${{ steps.set_app_version.outputs.APP_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log release / checkout context
        run: |
          echo "=== set-app-version job context ==="
          echo "github.sha=${{ github.sha }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.event_name=${{ github.event_name }}"
          echo "release.tag_name=${{ github.event.release.tag_name }}"
          echo "release.target_commitish=${{ github.event.release.target_commitish }}"
          echo "PWD=$(pwd)"
          git rev-parse HEAD 2>/dev/null || true
          git log -1 --oneline 2>/dev/null || true
          echo "--- pubspec version line ---"
          grep -m1 '^version:' pubspec.yaml || echo "(no version line found)"

      - name: Set app version
        id: set_app_version
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/scripts/set_app_version.sh
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Log app version outputs
        run: |
          echo "APP_VERSION=${{ steps.set_app_version.outputs.APP_VERSION }}"
          echo "BUILD_NUMBER=${{ steps.set_app_version.outputs.BUILD_NUMBER }}"
          if [ -z "${{ steps.set_app_version.outputs.APP_VERSION }}" ]; then
            echo "::error::APP_VERSION output is empty"
            exit 1
          fi
          if [ -z "${{ steps.set_app_version.outputs.BUILD_NUMBER }}" ]; then
            echo "::error::BUILD_NUMBER output is empty"
            exit 1
          fi

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [set-app-version]
    env:
      HOME: ${{ github.workspace }}
      APP_VERSION: ${{ needs.set-app-version.outputs.APP_VERSION }}
      BUILD_NUMBER: ${{ needs.set-app-version.outputs.BUILD_NUMBER }}
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      APK_PATH: build/app/outputs/flutter-apk/app-release.apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log version propagation
        run: |
          echo "APP_VERSION=[${APP_VERSION}]"
          echo "BUILD_NUMBER=[${BUILD_NUMBER}]"
          if [ -z "${APP_VERSION}" ]; then
            echo "::error::APP_VERSION is empty"
            exit 1
          fi
          if [ -z "${BUILD_NUMBER}" ]; then
            echo "::error::BUILD_NUMBER is empty"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Ensure HOME and safe git directory
        run: |
          if [ -z "${HOME:-}" ]; then
            HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
            export HOME
            echo "HOME=$HOME" >> "$GITHUB_ENV"
          fi
          git config --global --add safe.directory '*'

      - name: Restore dependencies
        run: flutter pub get

      - name: Set release signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/scripts/set_release_key.sh

      - name: Build release app bundle
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name "${APP_VERSION}" \
            --build-number "${BUILD_NUMBER}"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${APP_VERSION}" \
            --build-number "${BUILD_NUMBER}"

      - name: Verify release AAB exists
        run: |
          echo "Looking for AAB at: ${AAB_PATH}"
          if [ ! -f "${AAB_PATH}" ]; then
            echo "::error::AAB not found at ${AAB_PATH}"
            find build/app/outputs -name '*.aab' -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "${AAB_PATH}"

      - name: Upload release AAB to GitHub release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.AAB_PATH }}
          asset_name: app-release.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Verify release APK exists
        run: |
          echo "Looking for APK at: ${APK_PATH}"
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::APK not found at ${APK_PATH}"
            find build/app/outputs -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "${APK_PATH}"

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.APK_PATH }}

      - name: Read application id
        run: |
          PACKAGE_NAME=$(grep -m1 -oE 'applicationId = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::applicationId not found in android/app/build.gradle.kts"
            exit 1
          fi
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Publish app to Play Store
        uses: r0adkll/upload-google-play@v1.1.1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: production
          status: completed
          inAppUpdatePriority: 4

  post-build:
    runs-on: ubuntu-latest
    needs: [build-and-publish, set-app-version]
    env:
      HOME: ${{ github.workspace }}
      APP_VERSION: ${{ needs.set-app-version.outputs.APP_VERSION }}
      BUILD_NUMBER: ${{ needs.set-app-version.outputs.BUILD_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}


      - name: Update pubspec.yaml
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/scripts/update_pubspec.sh
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Update changelog
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/scripts/update_changelog.sh
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          APP_VERSION: ${{ env.APP_VERSION }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: |
            pubspec.yaml
            CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }}"
          body: "Automated change to bump version to ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }} and update CHANGELOG.md after Play Store publishing."
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          base: main
          branch: release-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          delete-branch: true
          title: "chore: bump version to ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }}"
          draft: false
