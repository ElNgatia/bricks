{{=<% %>=}}
name: Publish to App Store

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Application version (e.g. 1.0.0)'
        required: true
        type: string
      build_number:
        description: 'Build number (must increase per upload)'
        required: true
        type: string
      export_method:
        description: 'IPA export method (app-store or ad-hoc)'
        required: false
        default: 'app-store'
        type: string
      publish_listing:
        description: 'Upload store metadata + screenshots and submit for review'
        required: false
        default: false
        type: boolean

jobs:
  release-ios:
    runs-on: macos-latest
    name: Release iOS
    env:
      APP_VERSION: ${{ github.event.inputs.app_version }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number }}
      EXPORT_METHOD: ${{ github.event.inputs.export_method }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read Flutter version and bundle id
        run: |
          echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
          BUNDLE_ID=$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;' ios/Runner.xcodeproj/project.pbxproj | grep -v RunnerTests | head -1 | sed -E 's/.*= (.*);/\1/')
          if [ -z "$BUNDLE_ID" ]; then
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER not found in ios/Runner.xcodeproj/project.pbxproj"
            exit 1
          fi
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Log build inputs
        run: |
          echo "=== iOS Release ==="
          echo "APP_VERSION   = $APP_VERSION"
          echo "BUILD_NUMBER  = $BUILD_NUMBER"
          echo "EXPORT_METHOD = $EXPORT_METHOD"

      - name: Setup Xcode Signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          PP_PATH=$RUNNER_TEMP/temp.mobileprovision

          # Import certificate and provisioning profile from secrets
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v

          # Use UUID for the name of provisioning profile
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "IOS_PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "IOS_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

      # The Runner project uses Automatic signing, which needs an Apple account
      # at archive time - CI runners have none. Archive unsigned, then re-sign
      # and export with the imported profile.
      - name: Flutter Build (unsigned archive)
        run: >-
          flutter build ipa
          --release
          --no-codesign
          --build-name $APP_VERSION
          --build-number $BUILD_NUMBER

      - name: Export signed IPA
        run: bash .github/workflows/scripts/export_signed_ipa.sh

      - name: Clean Up
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/temp.mobileprovision || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ env.APP_VERSION }}
          path: build/ios/ipa/*.ipa

      - name: Upload IPA to App Store Connect
        if: ${{ env.EXPORT_METHOD == 'app-store' }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/app-release.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Publish listing and submit for review
        if: ${{ github.event.inputs.publish_listing == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          ASC_DEMO_USER: ${{ secrets.APPSTORE_DEMO_USER }}
          ASC_DEMO_PASSWORD: ${{ secrets.APPSTORE_DEMO_PASSWORD }}
          ASC_CONTACT_FIRST_NAME: ${{ vars.APPSTORE_CONTACT_FIRST_NAME }}
          ASC_CONTACT_LAST_NAME: ${{ vars.APPSTORE_CONTACT_LAST_NAME }}
          ASC_CONTACT_EMAIL: ${{ vars.APPSTORE_CONTACT_EMAIL }}
          ASC_CONTACT_PHONE: ${{ vars.APPSTORE_CONTACT_PHONE }}
          ASC_REVIEW_NOTES: ${{ vars.APPSTORE_REVIEW_NOTES }}
        run: |
          printf '%s' "$APPSTORE_PRIVATE_KEY" > $RUNNER_TEMP/AuthKey.p8
          export ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          cd ios
          fastlane ios submit_review app_version:$APP_VERSION build_number:$BUILD_NUMBER
