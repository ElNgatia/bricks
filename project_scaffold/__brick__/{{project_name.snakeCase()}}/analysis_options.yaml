include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
  plugins:
    - custom_lint

linter:
  rules:
    prefer_single_quotes: true

formatter:
  trailing_commas: preserve
