name: {{project_name.snakeCase()}}
description: "{{project_description}}"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: {{sdk_constraint}}

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  dio: ^5.9.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.2.0
  {{#use_biometrics}}
  local_auth: ^2.3.0
  {{/use_biometrics}}
  connectivity_plus: ^7.1.1
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  intl: ^0.20.2
  timeago_plus: ^1.4.0
  equatable: ^2.0.8
  google_fonts: ^8.1.0
  uuid: ^4.5.3
  logger: ^2.7.0
  riverpod: ^3.0.3
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  file_selector: ^1.0.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  collection: ^1.19.1
  auto_size_text: ^3.0.0
  file_picker: ^13.1.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  {{#use_firebase}}
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  flutter_local_notifications: ^22.1.0
  {{/use_firebase}}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: 3.0.3
  riverpod_lint: 3.0.3
  custom_lint: 0.8.1
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

